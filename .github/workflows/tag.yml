name: Tag New Version

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 2

      - uses: salsify/action-detect-and-tag-new-version@v2.0.3
        with:
          version-command: |
            cat VERSION